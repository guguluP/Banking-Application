name: iOS
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_27.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.app
          elif [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
      - name: Build iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "Banking Application.xcodeproj" \
            -scheme "Banking Application" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build Mac Catalyst
        if: always()
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "Banking Application.xcodeproj" \
            -scheme "Banking Application" \
            -destination "platform=macOS,variant=Mac Catalyst" \
            CODE_SIGNING_ALLOWED=NO
      - name: Test
        if: always()
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("no iPhone simulator")
          ')
          xcodebuild test \
            -project "Banking Application.xcodeproj" \
            -scheme "Banking Application" \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -only-testing:"Banking ApplicationTests" \
            CODE_SIGNING_ALLOWED=NO
